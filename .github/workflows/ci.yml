name: api-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          TZ: Asia/Shanghai
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20
      redis:
        image: redis:6.2
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:3.12.9
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin
        ports:
          - 5672:5672

    steps:
      - name: Checkout autotest
        uses: actions/checkout@v4

      - name: Checkout big-market backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/big-market
          ref: main
          path: big-market

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Init databases
        run: |
          mysql -h 127.0.0.1 -P 13306 -uroot -p123456 \
            -e "create database if not exists big_market default character set utf8mb4;
                create database if not exists big_market_01 default character set utf8mb4;
                create database if not exists big_market_02 default character set utf8mb4;"
          mysql -h 127.0.0.1 -P 13306 -uroot -p123456 big_market \
            < big-market/docs/dev-ops/environment/mysql/sql/big_market.sql
          mysql -h 127.0.0.1 -P 13306 -uroot -p123456 big_market \
            < big-market/docs/dev-ops/environment/mysql/sql/big_market_master.sql
          mysql -h 127.0.0.1 -P 13306 -uroot -p123456 big_market_01 \
            < big-market/docs/dev-ops/environment/mysql/sql/big_market_shards.sql
          mysql -h 127.0.0.1 -P 13306 -uroot -p123456 big_market_02 \
            < big-market/docs/dev-ops/environment/mysql/sql/big_market_shards.sql

      - name: Build backend
        run:
          mvn -B -q -pl big-market-app -am -DskipTests package
        working-directory: big-market

      - name: Start service
        run: |
          cd big-market/big-market-app/target
          nohup java -jar big-market-app.jar > ../../../app.log 2>&1 &
          cd -

      - name: Wait for service
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -X POST http://127.0.0.1:8091/api/v1/activity/query_account_quota \
              -H 'Content-Type: application/json' \
              -d '{"userId":"xiaofuge","activityId":100301}' > /dev/null; then
              echo "service is up"
              exit 0
            fi
            sleep 2
          done
          echo "service failed to start"
          tail -n 300 app.log
          exit 1

      - name: Run API tests
        env:
          BIG_MARKET_BASE_URL: http://127.0.0.1:8091
        run:
          pytest -q --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
